# QIIME2
manifest: 
  "data/metadata/aim1_manifest.tsv"
metadata:
  "data/metadata/aim1_metadata.tsv"

data_format: # format of reads to be imported; note the double quotations for string form
  #"'CasavaOneEightSingleLanePerSampleDirFmt'"
  "'PairedEndFastqManifestPhred33V2'"
  #"'PairedEndFastqManifestPhred64V2'"

classifier:
  "classifier/silva-138-99-nb-classifier.qza"
  #"classifier/longitudinal_classifier.qza"

table-frequency: #minimum frequency a feature must show or it will be filtered out
  "10"

sample-frequency: # minimum number of samples a feature must appear in or it will be filtered out
  "2"

table-include: #only include features classified down to the selected taxonomic level
  "p__"
  #"c__"
  #"k__"

table-filter: #determines which features will be removed from table due to host genome, etc.
  "chloroplast,mitochondria,eukaryota" 
#must be comma separated with no spaces for each group you'd like to filter

beta-div-column: #which variable from metadata file is being measured
  "Groups"

# adapter sequence(s) to trim. Use ^ or $ to respectively "anchor" a sequence to the beginning or end of the read (recommended for 5' sequences).
# use commas [without spaces] to search for multiple sequences (e.g., seq1,seq2,seq3). Leave a sequence as "" to avoid trimming in that location.
# leave all sequences as "" to avoid trimming entirely.
cutadapt:
  front_f: "^CCTACGGGNGGCWGCAG"     # forward read 5' (beginning) adapter sequence(s) to trim.
  adapter_f: "CTGTCTCTTATACACATCT"  # forward read 3' (end) adapter sequence(s) to trim.
  front_r: "^GACTACHVGGGTATCTAATCC" # reverse read 3' (beginning) adapter sequence(s) to trim.
  adapter_r: "CTGTCTCTTATACACATCT"  # reverse read 5' (end) adapter sequence(s) to trim.
  minimum_length: "20" # trimmed reads shorter than this will be removed
  times: "1" # number of times to search each read. Increasing this will allow trimming when more than 1 of the specified sequences is present.

# manual trimming; note that the parameters are string form
trunclenf:
  "237"
trunclenr:
  "213"
trimleftf:
  "40"
trimleftr:
  "40"

sampling_depth_phylogenetic:
  "5000"

threads:
  trimming: 16
  denoising: 16
  classify_sklearn: 16
  mafft_fasttree: 16
  qza_to_phyloseq: 8

alpha_color_category:
  "Group"

alpha_x_category:
  "Chrono_TP"

beta_comparison_category:
  "Group"

taxa_lower_level_barplot:
  "Genus"

taxa_comparison_category:
  "Group"

heatmap_level:
  "Order"

heatmap_comparison_category:
  "Group"

# QIIME2 pipeline outputs
# set these files as your targets at the top of your Snakefile

#  STEP 1 this is for choosing filter parameters
#  "artifacts/demux-paired-end.qzv"

#  STEP 2 this is for choosing sampling depth
#  "artifacts/table-viz.qzv", "artifacts/rooted-tree.qza"

#  STEP 3 choose a prebuilt visual output
#  "visual_outputs/alpha_div.pdf", "visual_outputs/beta_div.pdf", "visual_outputs/absolute_barplot.pdf", "visual_outputs/heatmap.pdf"

#  NOTE- if you wish to skip the prebuilt visual options and instead jump right into custom output, set this as your target for STEP 3 of the pipeline:
#   "artifacts/physeq.RDS"
