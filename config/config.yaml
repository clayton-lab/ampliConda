#DADA2 in R
R_metadata:
  "data/paired_end_metadata.csv"

filt_path:
  "filtered"

trimming_setting:
  "manual"
  #"automatic"

# note these trimming parameters need to be number form
forward_trunc_R:
  280
reverse_trunc_R:
  250
minimum_sequence_quality:
  20

max_sequences_processed: #keep in scientific notation for ease of use
  1e+06